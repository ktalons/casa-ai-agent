# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow checks out code, performs a Codacy security scan
# and integrates the results with the
# GitHub Advanced Security code scanning feature.  For more information on
# the Codacy security scan action usage and parameters, see
# https://github.com/codacy/codacy-analysis-cli-action.
# For more information on Codacy Analysis CLI in general, see
# https://github.com/codacy/codacy-analysis-cli.

name: Codacy Security Scan

on:
  push:
    branches: [ "main", "protect-main" ]
  pull_request:
    # The branches below must be a subset of the branches above
    branches: [ "main" ]
  schedule:
    - cron: '38 19 * * 1'

permissions:
  contents: read

jobs:
  codacy-security-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Codacy Security Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout code
        uses: actions/checkout@v4

      # Execute Codacy Analysis CLI and generate a SARIF output with the security issues identified during the analysis
      # v4.4.7. The earlier pin (tag 1.1.0) ran CLI 4.0.0, whose Docker client speaks API 1.39;
      # current runner daemons refuse anything below 1.40, so every scanner exited with 125.
      - name: Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08
        with:
          # Check https://github.com/codacy/codacy-analysis-cli#project-token to get your project token from your Codacy repository
          # You can also omit the token and run the tools that support default configurations
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          verbose: true
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will handover control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # Codacy writes one SARIF run per scanner (33 on this repo). Code scanning refuses several
      # runs under one category and more than 20 runs per upload. Give each run a stable category
      # named after its scanner (a suffix only when a scanner appears twice), then split the runs
      # into files of at most 20. Empty runs are kept on purpose: an upload with no results is
      # what closes a scanner's old alerts. Zero runs, or more than the steps below cover, fails.
      - name: Categorize SARIF runs and split them into uploads of 20
        run: |
          jq '.runs |= (group_by(.tool.driver.name) | map(to_entries | map(.value + {automationDetails: {id: ("codacy/" + (.value.tool.driver.name | ascii_downcase | gsub("[^a-z0-9]+"; "-") | ltrimstr("-") | rtrimstr("-")) + (if .key > 0 then "-\(.key)" else "" end) + "/")}})) | add // [])' results.sarif > results.categorized.sarif
          total=$(jq '.runs | length' results.categorized.sarif)
          if [ "$total" -eq 0 ]; then echo "::error::Codacy produced no SARIF runs; check the analysis step"; exit 1; fi
          if [ "$total" -gt 60 ]; then echo "::error::$total SARIF runs is more than the three 20-run upload steps cover"; exit 1; fi
          mkdir -p sarif
          for i in 0 1 2; do
            jq --argjson i "$i" '.runs |= .[($i * 20):(($i + 1) * 20)]' results.categorized.sarif > "sarif/part-$i.sarif"
            if [ "$(jq '.runs | length' "sarif/part-$i.sarif")" -eq 0 ]; then rm "sarif/part-$i.sarif"; fi
          done
          echo "SARIF runs: $total"

      - name: Upload SARIF results (runs 1-20)
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif/part-0.sarif

      - name: Upload SARIF results (runs 21-40)
        if: hashFiles('sarif/part-1.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif/part-1.sarif

      - name: Upload SARIF results (runs 41-60)
        if: hashFiles('sarif/part-2.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: sarif/part-2.sarif
