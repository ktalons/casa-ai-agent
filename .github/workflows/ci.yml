name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plugin:
    name: plugin — manifest + components
    runs-on: ubuntu-latest
    # The validator needs the Claude Code CLI. Pinned so CI and local dev check the same rules.
    # Marked non-blocking until it is confirmed to run without an authenticated session.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code@2.1.289
      - run: claude plugin validate --strict .

  typecheck:
    name: typecheck + tests + fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: tsc --noEmit (strict)
        run: bun x tsc --noEmit
      - name: agent frontmatter + unit tests
        run: bun test
      - name: validate intake fixtures
        run: bun intake/Validate.ts
      - name: validator rejects a malformed intake
        shell: bash
        run: |
          set -euo pipefail
          bad="$(mktemp).json"
          echo '{"schema":"wrong"}' > "$bad"
          if bun intake/Validate.ts "$bad"; then
            echo "validator accepted a malformed intake" >&2
            exit 1
          fi
          echo "ok — malformed intake rejected"

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Pinned to a commit SHA (v2.3.9) rather than the floating v2 tag so a
      # retag can't silently change what runs in CI.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7
